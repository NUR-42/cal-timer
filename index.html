<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Calculator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,sans-serif;
}

body{
    background:#020617;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:1000px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.card{
    background:#111827;
    border:2px solid #06b6d4;
    border-radius:20px;
    padding:30px;
    box-shadow:0 0 25px #06b6d4;
}

.card h2{
    text-align:center;
    color:#22d3ee;
    margin-bottom:25px;
    font-size:30px;
}

#display{
    width:100%;
    height:70px;
    background:#0f172a;
    border:none;
    border-radius:12px;
    color:#22d3ee;
    font-size:32px;
    text-align:right;
    padding:15px;
    margin-bottom:20px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

button{
    padding:18px;
    border:none;
    border-radius:12px;
    background:#1e293b;
    color:#22d3ee;
    font-size:22px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#06b6d4;
    color:black;
    transform:scale(1.08);
}

.timer{
    text-align:center;
    font-size:75px;
    color:#22d3ee;
    margin:40px 0;
}

.controls{
    display:flex;
    justify-content:center;
    gap:15px;
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <h2>Neon Calculator</h2>

        <input type="text" id="display" readonly>

        <div class="buttons">

            <button onclick="clearDisplay()">C</button>
            <button onclick="append('/')">/</button>
            <button onclick="append('*')">*</button>
            <button onclick="removeLast()">⌫</button>

            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button onclick="append('-')">-</button>

            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button onclick="append('+')">+</button>

            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button onclick="calculate()">=</button>

            <button onclick="append('0')">0</button>
            <button onclick="append('.')">.</button>

        </div>

    </div>

    <div class="card">

        <h2>Stopwatch</h2>

        <div class="timer" id="timer">
            00:00
        </div>

        <div class="controls">

            <button onclick="start()">Start</button>
            <button onclick="pause()">Pause</button>
            <button onclick="reset()">Reset</button>

        </div>

    </div>

</div>

<script>

let display = document.getElementById("display");

function append(value){
    display.value += value;
}

function clearDisplay(){
    display.value = "";
}

function removeLast(){
    display.value = display.value.slice(0,-1);
}

function calculate(){

    try{
        display.value = eval(display.value);
    }

    catch{
        display.value = "Error";
    }
}

let sec = 0;
let min = 0;
let timer = null;

function update(){

    sec++;

    if(sec == 60){
        min++;
        sec = 0;
    }

    let m = min < 10 ? "0"+min : min;
    let s = sec < 10 ? "0"+sec : sec;

    document.getElementById("timer").innerText = `${m}:${s}`;
}

function start(){

    if(timer == null){
        timer = setInterval(update,1000);
    }
}

function pause(){

    clearInterval(timer);
    timer = null;
}

function reset(){

    pause();

    sec = 0;
    min = 0;

    document.getElementById("timer").innerText = "00:00";
}

</script>

</body>
</html>
